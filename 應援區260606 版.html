  var listEl    = document.getElementById('mixxList');

  SONGS.forEach(function (group) {
    var lbl = document.createElement('div');
    lbl.className = 'mixx-section-label';
    lbl.textContent = group.section;
    listEl.appendChild(lbl);

    group.songs.forEach(function (song) {
      var row = document.createElement('div');
      row.className = 'mixx-song-row';
      var tag = TAG[song.type];
      row.innerHTML =
        '<span class="mixx-song-num">'  + song.num  + '</span>' +
        '<span class="mixx-song-name">' + song.name + '</span>' +
        '<span class="' + tag.cls + '">'+ tag.text  + '</span>';

      row.addEventListener('click', function () {
        if (activeRow) activeRow.classList.remove('mixx-active');
        row.classList.add('mixx-active');
        activeRow = row;
        renderContent(song);

        if (window.innerWidth <= 768) {
          listEl.classList.remove('open');
          document.getElementById('mixxToggle').textContent = '▾ 展開歌單';
        }
      });

      listEl.appendChild(row);
    });
  });

  /* ============================================================

  ============================================================ */
  function esc(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function imageHtml(src) {
    return '<div class="mixx-image-wrap"><img src="' + esc(src) + '" alt="Bae Kyujin dance break"></div>';
  }

  function videoHtml(youtubeId) {
    var inner = youtubeId
      ? '<iframe src="https://www.youtube.com/embed/' + esc(youtubeId) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>'
      : '<div class="mixx-video-ph"><span class="mixx-video-ph-icon">▶</span><span>YouTube 影片待嵌入</span></div>';
    return '<div class="mixx-video-wrap">' + inner + '</div>';
  }

  function renderContent(song) {
    var tag = TAG[song.type];
    var stickyHtml =
      '<h2 class="mixx-panel-title">' + esc(song.name) + '</h2>' +
      '<div class="mixx-panel-meta">' +
        '<span class="' + tag.cls + '">' + tag.text + '</span>' +
        '<span class="mixx-panel-num">' + song.num + '</span>' +
      '</div>';
    var scrollHtml = '';

    if (song.type !== 'cheer') {
      stickyHtml += song.image ? imageHtml(song.image) : videoHtml(song.youtube);
      scrollHtml =
        '<div class="mixx-no-cheer-box">' +
          '<span class="mixx-no-cheer-icon">♪</span>' +
          '<p class="mixx-no-cheer-text">這首歌沒有官方應援法<br>盡情享受現場演出就好！</p>' +
        '</div>';
    } else {
      if (song.youtube) { stickyHtml += videoHtml(song.youtube); }
      var data = CHEER_DATA[song.name];
      if (data && data.lines && data.lines.length) {
        data.lines.forEach(function (line) {
          if (line.html) {
            scrollHtml += '<div class="mixx-cheer-line">' + line.text + '</div>';
          } else {
            var cls = line.cheer ? 'mixx-cheer-line is-cheer' : 'mixx-cheer-line';
            scrollHtml += '<div class="' + cls + '">' + esc(line.text) + '</div>';
          }
        });
      } else {
        scrollHtml = '<div class="mixx-no-cheer-box"><p class="mixx-no-cheer-text">（應援內容待填入）</p></div>';
      }
    }

    panelEl.innerHTML =
      '<div class="mixx-panel-sticky">' + stickyHtml + '</div>' +
      '<div class="mixx-panel-scroll">' + scrollHtml + '</div>';

    var scrollEl = panelEl.querySelector('.mixx-panel-scroll');
    if (scrollEl) scrollEl.scrollTop = 0;
  }
